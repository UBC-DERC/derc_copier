# End-to-end test of the *documented student install flow*
# (docs/copier/using/installing.md -> building.md). Unlike validation.yml (which
# only renders templates via ctt), this workflow installs copier as a persistent
# tool and actually generates a project from the template on Windows, macOS and
# Linux, then checks the generated files and post-generation git tasks.
#
# Runs on `main` only. If every matrix leg passes, a CalVer tag is created on the
# tested commit (that tag is what `copier copy` then hands to students).

name: install_flow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    # Use bash everywhere, including Windows (Git Bash), so one assertion script
    # works across all runners.
    shell: bash

jobs:
  install-flow:
    name: install (${{ matrix.os }} / ${{ matrix.primary_language }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        primary_language: [python, r]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Put uv tool bin on PATH and in ENV so we can access copier once it is installed.
        run: |
          echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/uv-tool-bin" >> "$GITHUB_ENV"                                                                                                                             
          echo "$RUNNER_TEMP/uv-tool-bin"                 >> "$GITHUB_PATH"

      - name: Configure git identity (required by the template's post-tasks)
        run: |
          git config --global user.name "DERC CI"
          git config --global user.email "ci@ubc-derc.example"
          git config --global init.defaultBranch main

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # This workflow never checks out the repo (it tests the student install
          # flow via `copier copy` against the remote repo), so there are no
          # dependency files to hash for a cache key. Caching here would only warn
          # about "cache will never get invalidated", so disable it.
          enable-cache: false

      # R projects need R + Rscript on PATH so the template's renv init post-task
      # can run. Python projects don't need this leg.
      - name: Set up R
        if: ${{ matrix.primary_language == 'r' }}
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
          # We only run Rscript to install the renv *binary* (served pre-built by
          # public RSPM) and initialise a project. Nothing is compiled from
          # source, so Rtools is unnecessary. Skipping it also avoids the
          # flaky Rtools45 silent installer that hangs on windows-latest and
          # fails with "Error: The operation was canceled."
          rtools-version: 'none'

      - name: Install copier as a persistent tool
        # Mirrors installing.md "Option 2 - install it as a persistent tool".
        # copier.yml uses the jinja2_time.TimeExtension Jinja extension, which must
        # be importable from copier's isolated tool venv, so inject it with --with.
        run: uv tool install --with jinja2-time copier

      - name: Generate a project from the template (documented flow)
        # Mirrors building.md. --defaults/--data replace the interactive prompts
        # that a student would answer by hand. --vcs-ref pins to the commit that
        # triggered this run, so we test exactly what landed on main.
        run: |
          mkdir newproject
          cd newproject
          copier copy \
            --defaults \
            --data primary_language=${{ matrix.primary_language }} \
            --vcs-ref "${{ github.sha }}" \
            https://github.com/UBC-DERC/derc_copier . --trust

      - name: Assert generated files + post-generation git tasks
        run: |
          set -euo pipefail
          cd newproject

          echo "== Common files =="
          for f in README.md .copier-answers.yml CITATION.cff CHANGELOG.md project_setup.md; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

          echo "== Language-specific files =="
          if [ "${{ matrix.primary_language }}" = "python" ]; then
            test -f pyproject.toml || { echo "MISSING: pyproject.toml"; exit 1; }
            test -d src            || { echo "MISSING: src/";          exit 1; }
          else
            test -f DESCRIPTION || { echo "MISSING: DESCRIPTION"; exit 1; }
            test -f NAMESPACE   || { echo "MISSING: NAMESPACE";   exit 1; }
          fi

          echo "== git post-tasks (init + commit + tag) =="
          git rev-parse --verify HEAD >/dev/null || { echo "no git HEAD"; exit 1; }
          git log -1 --pretty=%s | grep -q "Initial commit from Copier template" \
            || { echo "initial commit message not found"; exit 1; }
          # copier.yml tags the initial release with the CalVer project_version.
          git tag | grep -Eq '^v[0-9]{2}\.[0-9]{2}' \
            || { echo "expected a CalVer vYY.MM tag"; git tag; exit 1; }

          echo "All assertions passed."

  tag-release:
    name: Tag CalVer release
    needs: install-flow
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next CalVer tag
        id: calver
        run: |
          set -euo pipefail
          git fetch --tags --force
          base="v$(date -u +%y.%m)"
          if ! git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            new="$base"
          else
            # base exists -> find highest patch suffix base.N and increment.
            n=0
            while read -r t; do
              [ -n "$t" ] || continue
              suf="${t##*.}"
              if [[ "$suf" =~ ^[0-9]+$ ]] && [ "$suf" -gt "$n" ]; then
                n="$suf"
              fi
            done < <(git tag --list "${base}.*")
            new="${base}.$((n + 1))"
          fi
          echo "Next tag: $new"
          echo "tag=$new" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          # Annotated tags record a tagger identity, so configure it here.
          # This job is separate from install-flow, so its git identity does
          # not carry over.
          git config user.name "DERC CI"
          git config user.email "ci@ubc-derc.example"
          tag="${{ steps.calver.outputs.tag }}"
          git tag -a "$tag" -m "Release $tag (passed cross-OS install e2e for ${GITHUB_SHA})"
          git push origin "$tag"
