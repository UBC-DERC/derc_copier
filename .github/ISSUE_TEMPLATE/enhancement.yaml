name: Enhancement Suggestions
description: Request a project enhancement.
title: "[Enhancement]: "
labels: ["enhancement"]
assignees:
  - SimonGoring
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to look at this project and help make it better!
  - type: dropdown
    id: scope
    attributes:
      label: What should this enhancement apply to?
      options:
        - The DERC Copier template itself
        - Generated projects (code, configs, etc.)
        - Documentation
      required: true
  - type: textarea
    id: what-should-happen
    attributes:
      label: What would you like to see happen?
      description: Let us know what you'd like to see added for this project?
      placeholder: Tell us what you envision!
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: What programming language are you generating a project for?
      description: (Only relevant for generated project enhancements)
      multiple: false
      options:
        - Python
        - R
        - Other
      required: false
  - type: dropdown
    id: pillar
    attributes:
      label: Which DERC goal does this support?
      description: See [DERC Best Practices](https://your-docs-link). (Optional—helps us prioritize)
      options:
        - Building Better Code
        - Attribution (Citation/Licensing/Describing)
        - Building Community
        - Staying Organized
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Why do you need this feature? What's the current limitation?
      placeholder: "Currently, users cannot... This would help because..."
      validations:
        required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/UBC-DERC/derc_copier/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots or mockups
      description: If applicable, add screenshots, UI mockups, or example code to help explain your idea.
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Please provide any additional information that may help us understand your request, including external references or links that would help us.
      placeholder: Any other details you think are relevant.
    validations:
      required: false