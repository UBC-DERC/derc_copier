name: Enhancement Suggestions
description: Request a project enhancement.
title: "[Enhancement]: "
labels: ["enhancement"]
assignees:
  - SimonGoring
type: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to look at this project and help make it better!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-should-happen
    attributes:
      label: What would you like to see happen?
      description: Let us know what you'd like to see added for this project?
      placeholder: Tell us what you envision!
      value: "I want a new thing!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 26.09 (Most recent version)
        - 26.08.x
      default: 0
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: What programming language are you using?
      multiple: true
      options:
        - Python
        - R
        - Other
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/UBC-DERC/derc_copier/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Please provide any additional information that may help us understand your request, including external references or links that would help us.
      placeholder: Any other details you think are relevant.
    validations:
      required: false