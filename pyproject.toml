[project]
name = "derc-copier"
version = "26.08"
description = "A templating tool for UBC DERC programming projects."
readme = "README.md"
authors = [
    { name = "Simon Goring", email = "simon.j.goring@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2-time>=0.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "beautifulsoup4>=4.12.3",
]

[project.scripts]
derc-copier = "derc_copier:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cffconvert>=2.0.0",
    "copier-template-tester>=2.5.0",
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-material[imaging]>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "ruff>=0.16.0",
]
