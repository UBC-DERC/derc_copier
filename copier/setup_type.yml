# profile selection
template_profile:
  type: str
  default: "recommended"
  help: |
    Select a profile. The full list of questions is visible in the documentation for
    this template. The `recommended` setting doesn't set every option, but it is designed
    to give you the most complete set of options for a new project.
  choices:
    Recommended (best practice elements for research software): "recommended"
    Minimum (bare minimum, no extra features): "minimum"
    Let me enter each feature myself: "ask"
