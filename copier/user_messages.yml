# user messages
_message_before_copy: |
    Thanks for generating a project using this template. This template borrows from the
    Netherlands eScience Center's Python project template. 

    As you create your project, you will be asked a set of questions, with pre-set defaults.
    You can always go back and change elements of your new project, we are just providing initial setup and
    links to help you follow best practices.

    For each question there is a placeholder. Make sure you provide an
    input to each of them.

_message_after_copy: |
    Your project "{{ project_name }}" has been successfully created in the 
    {{ _copier_conf.dst_path }} folder!

    {% if template_profile != 'minimum' and git_use -%}

        Next steps:

            - Below are the commands to put your Python package under version control using git:

                cd {{ _copier_conf.dst_path }}
                git init
                git add --all
                git commit -m "first commit"
                git tag -a v{{ project_version }} -m "Initial release from Copier template"
                git branch -M main
                git remote add origin https://{{ git_platform }}/{{ project_org }}/{{ project_repository }}/{{ project_name}}.git

            - Push the initial commit to a new repo on GitHub

                Go to https://github.com/organizations/{{project_repository}}/repositories/new
                and create a new repository named `{{ project_name }}` as an empty repository, then push your commits to GitHub:

                git push --set-upstream origin main

            - Project layout explained

                For an explanation of what files are there, and what each of these do, please refer to {{ _copier_conf.dst_path }}/project_setup.md

    {%- endif-%}

_message_before_update: |
    Thanks for updating your project using our template.

    You'll be asked a series of questions whose answers are pre-populated
    with previously entered values. Feel free to change them as needed.

_message_after_update: |
    Your project "{{ project_name }}" has been updated successfully!
    In case there are any conflicts, please resolve them. Then,
    you're done.