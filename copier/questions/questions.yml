project_name:
  type: str
  help: |
    The name of your project. This will be used to generate the name of your repository, and will be used in the README file.
    Your project_name must start with a letter, followed one or more letters, digits or dashes all lowercase.
  default: new-derc-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9\-]+$')) %}
    Your project_name must start with a letter, followed one or more letters, digits or dashes all lowercase.
    {% endif %}

repository:
  type: str
  help: |
    The name of your GitHub organization (your user name, or UBC-DERC). This will be used to generate the URL for your repository, and will be used in the README file.
    Your repository name must start with a letter, followed one or more letters, digits or dashes all lowercase.
  default: UBC-DERC
  validator: >-
    {% if not (repository | regex_search('^[a-zA-Z][a-zA-Z0-9\-]+$')) %}
    Your repository name must start with a letter, followed one or more letters, digits or dashes all lowercase.
    {% endif %}

project_description:
  type: str
  help: Please write a short description of the intention of your project.
  default: A research project for the Dairy Education Research Centre at the University of British Columbia.

author_formal:
  help: |
    The `formal` name is considered to be the name used when people fomally
    address you as Dr. Grojan (for example), or Mx. Bejar. 
  type: str
  default: LastName

author_given:
  type: str
  help: |
    This is the legal given name that an individual uses.
    In some cases the formal name is the only name an individual uses.
    Consider `formal` and `given` the names you would use for citation.
  default: FirstName

author_orcid:
  help: |
    Provide your full ORCID (if known).
    This will be used to generate badges on your README file, and will link to the citation file for your repository.
    Note that the format for an ORCID is "https://orcid.org/XXXX-XXXX-XXXX-XXXX", not just the number/letter combination at the end.
  type: str
  default: https://orcid.org/0000-0000-0000-000X

copyright_year:
    type: int
    help: |
      The year that you want to be listed on your copyright notice.
      This will be used to generate a badge on your README file, and will link to the citation file for your repository.
    default: 2026

license_type:
  type: str
  help: |
    The license defines how your code can be shared and attributed.
    A list of open license types is available at https://choosealicense.com/licenses/
  choices:
    - Apache License 2.0
    - MIT License
    - No License
  default: No License

code_of_conduct_lang:
  type: str
  help: |
    What language(s) would you like your code of conduct to be represented in?
    A full list of translations can be viewed at https://www.contributor-covenant.org/translations/
  choices:
    English (v3.0):
      value: code_en
    French (v2.1):
      value: code_fr
    German (v3.0):
      value: code_de

lifecycle:
  type: str
  help: |
    The lifecycle stage of your project. This will be used to generate a badge on your README file.
  choices:
    Planning:
      value: lifecycle_planning
    Pre-Alpha:
      value: lifecycle_pre_alpha
    Alpha:
      value: lifecycle_alpha
    Beta:
      value: lifecycle_beta
    Production/Stable:
      value: lifecycle_production_stable
    Mature:
      value: lifecycle_mature
    Inactive:
      value: lifecycle_inactive
  default: lifecycle_planning

lifecycle_color:
  type: str
  default: |-
      {% if lifecycle == "lifecycle_planning" -%}
        crimson
      {%- elif lifecycle == "lifecycle_pre_alpha" -%}
        lightcoral
      {%- elif lifecycle == "lifecycle_alpha" -%}
        orange
      {%- elif lifecycle == "lifecycle_beta" -%}
        yellow
      {%- elif lifecycle == "lifecycle_production_stable" -%}
        yellowgreen
      {%- elif lifecycle == "lifecycle_mature" -%}
        green
      {%- elif lifecycle == "lifecycle_inactive" -%}
        lightgrey
      {%- else -%}
        lightgrey
      {%- endif %}
  when: false
