---
# General settings for copier
!include copier/settings.yml

---
# profiles
!include copier/setup_type.yml

---
# essential questions about the package details
!include copier/questions/questions.yml

---
# User messages
!include copier/user_messages.yml

---
# Post-processing tasks to run after the template is rendered
_tasks:
  - ["git", "init", "--initial-branch=main"]
  - ["git", "add", "."]
  - ["git", "commit", "-m", "Initial commit from Copier template"]
  - ["git", "tag", "-a", "v0.1.0", "-m", "Initial release from Copier template"]

_jinja_extensions:
  - jinja2_time.TimeExtension